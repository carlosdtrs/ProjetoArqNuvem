services:
  postgres-orders:
    image: postgres:15-alpine
    container_name: shopflow-postgres-orders
    restart: always
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: shopflow_user
      POSTGRES_PASSWORD: shopflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  frontend:
    build: ./frontend
    container_name: shopflow-frontend-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - postgres-orders

volumes:
  postgres_data:
