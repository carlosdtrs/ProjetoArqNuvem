services:
  postgres-orders:
    image: postgres:15-alpine
    container_name: shopflow-postgres-orders
    restart: always
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: shopflow_user
      POSTGRES_PASSWORD: shopflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: shopflow-backend-api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres-orders

  frontend:
    build: ./frontend
    container_name: shopflow-frontend-app
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - postgres-orders
      - backend

volumes:
  postgres_data:
